<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متشابهات القرآن الكريم — حافظ</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/theme.css">
<style>

.page-header {
  text-align: center;
  padding: 80px 20px 32px;
}
.page-header-label {
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.page-header-title {
  font-family: 'Amiri', serif;
  font-size: clamp(28px, 6vw, 48px);
  color: var(--white);
  margin-bottom: 10px;
}
.page-header-desc {
  font-size: 14px;
  color: var(--muted);
  line-height: 2;
  max-width: 520px;
  margin: 0 auto;
}

/* ── Search ── */
.search-wrap {
  max-width: 700px;
  margin: 28px auto 0;
  padding: 0 16px;
}
.search-input {
  width: 100%;
  padding: 12px 18px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: var(--bg2);
  color: var(--white);
  font-family: 'Amiri', serif;
  font-size: 18px;
  direction: rtl;
  outline: none;
  transition: border-color .2s;
  box-sizing: border-box;
}
.search-input::placeholder { color: var(--muted); font-size: 15px; font-family: 'Cairo', sans-serif; }
.search-input:focus { border-color: rgba(212,168,71,.5); }
.search-stats {
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  margin-top: 10px;
}
.search-stats strong { color: var(--gold); }

/* ── Group cards ── */
.groups-list {
  max-width: 760px;
  margin: 20px auto 80px;
  padding: 0 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.kgroup {
  background: var(--bg2);
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  transition: border-color .2s;
}
.kgroup:hover { border-color: rgba(212,168,71,.3); }
.kgroup-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  cursor: pointer;
  user-select: none;
  gap: 12px;
}
.kgroup-keyword {
  font-family: 'Amiri', serif;
  font-size: 19px;
  color: var(--gold-lt);
  flex: 1;
  direction: rtl;
}
.kgroup-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.kgroup-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(212,168,71,.1);
  color: var(--gold);
  border: 1px solid rgba(212,168,71,.25);
  border-radius: 10px;
  padding: 2px 10px;
  font-size: 12px;
  font-weight: 700;
}
.kgroup-toggle {
  color: var(--muted);
  font-size: 16px;
  transition: transform .2s;
}
.kgroup.open .kgroup-toggle { transform: rotate(180deg); }
.kgroup-body {
  display: none;
  border-top: 1px solid var(--line);
}
.kgroup.open .kgroup-body { display: block; }
.kayah {
  padding: 12px 18px;
  border-bottom: 1px solid rgba(212,168,71,.08);
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.kayah:last-child { border-bottom: none; }
.kayah-num {
  flex-shrink: 0;
  min-width: 36px;
  height: 28px;
  background: var(--bg3);
  border: 1px solid var(--line);
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  font-family: 'Cairo', sans-serif;
  margin-top: 4px;
}
.kayah-text {
  font-family: 'Amiri', serif;
  font-size: 17px;
  line-height: 2;
  color: var(--white);
  direction: rtl;
  flex: 1;
}

/* ── More button ── */
.more-wrap {
  text-align: center;
  padding: 20px;
}
.more-btn {
  padding: 10px 28px;
  border-radius: 24px;
  border: 1.5px solid var(--line);
  background: transparent;
  color: var(--muted);
  font-family: 'Cairo', sans-serif;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s;
}
.more-btn:hover { color: var(--gold); border-color: rgba(212,168,71,.4); }

/* ── Empty / loading states ── */
.state-msg {
  text-align: center;
  padding: 60px 20px;
  font-size: 15px;
  color: var(--muted);
}

</style>
</head>
<body>

<!-- back nav -->
<nav class="back-nav">
  <a href="index.html">→ الرئيسية</a>
</nav>

<!-- header -->
<div class="page-header">
  <div class="page-header-label">QURAN · MUTASHABIHAT</div>
  <h1 class="page-header-title">متشابهات القرآن الكريم</h1>
  <p class="page-header-desc">
    مجموعات الآيات التي تشترك في عبارة أو تركيب واحد عبر سور القرآن الكريم
  </p>
</div>

<!-- search -->
<div class="search-wrap">
  <input id="search-input" class="search-input"
         type="search"
         placeholder="ابحث بالكلمة المفتاحية أو نص الآية..."
         oninput="onSearch(this.value)"
         autocomplete="off">
  <div class="search-stats" id="search-stats">جارٍ التحميل...</div>
</div>

<!-- groups -->
<div class="groups-list" id="groups-list">
  <div class="state-msg">جارٍ تحميل البيانات...</div>
</div>

<script>
const PAGE_SIZE = 60;
let _data = null;
let _filtered = [];
let _shown = 0;

async function init() {
  try {
    const r = await fetch('src/data/mutashabihat.json');
    _data = await r.json();
    onSearch('');
  } catch (e) {
    document.getElementById('groups-list').innerHTML =
      '<div class="state-msg">تعذّر تحميل البيانات</div>';
  }
}

function onSearch(query) {
  if (!_data) return;
  const q = query.trim();
  _filtered = q
    ? _data.filter(g =>
        g.keyword.includes(q) ||
        g.ayat.some(a => a.text.includes(q))
      )
    : _data;
  _shown = 0;
  document.getElementById('groups-list').innerHTML = '';
  renderMore();
}

function renderMore() {
  const container = document.getElementById('groups-list');
  const batch = _filtered.slice(_shown, _shown + PAGE_SIZE);
  _shown += batch.length;

  if (batch.length === 0 && _shown === 0) {
    container.innerHTML = '<div class="state-msg">لا توجد نتائج</div>';
    updateStats();
    return;
  }

  const frag = document.createDocumentFragment();
  batch.forEach(g => {
    const el = document.createElement('div');
    el.className = 'kgroup';
    const ayatHTML = g.ayat.map(a => `
      <div class="kayah">
        <div class="kayah-num">${a.ayah_ref}</div>
        <div class="kayah-text">${a.text}</div>
      </div>`).join('');
    el.innerHTML = `
      <div class="kgroup-head" onclick="this.parentElement.classList.toggle('open')">
        <div class="kgroup-keyword">${g.keyword}</div>
        <div class="kgroup-meta">
          <span class="kgroup-badge">${g.ayat.length} آيات</span>
          <span class="kgroup-toggle">▾</span>
        </div>
      </div>
      <div class="kgroup-body">${ayatHTML}</div>`;
    frag.appendChild(el);
  });
  container.appendChild(frag);

  const existing = document.getElementById('more-btn-wrap');
  if (existing) existing.remove();
  if (_shown < _filtered.length) {
    const wrap = document.createElement('div');
    wrap.className = 'more-wrap';
    wrap.id = 'more-btn-wrap';
    wrap.innerHTML = `<button class="more-btn" onclick="loadMore()">عرض المزيد (${_filtered.length - _shown} متبقية)</button>`;
    container.appendChild(wrap);
  }

  updateStats();
}

function loadMore() {
  document.getElementById('more-btn-wrap')?.remove();
  renderMore();
}

function updateStats() {
  document.getElementById('search-stats').innerHTML =
    `عرض <strong>${_shown}</strong> من <strong>${_filtered.length}</strong> مجموعة`;
}

init();
</script>

</body>
</html>
