<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خواتيم الآيات — سورة النساء</title>
<link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../assets/css/theme.css">
<style>
:root {
  --bg3:     #0A1520;
  --green:   #4CAF82;
  --red:     #E05555;
}

/* ── Header ── */
header {
  text-align: center;
  padding: 36px 20px 28px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, #0A1520 0%, var(--bg) 100%);
  position: relative;
}
header::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse 60% 80% at 50% 0%, rgba(212,168,71,0.07) 0%, transparent 70%);
  pointer-events: none;
}
.surah-name {
  font-family: 'Amiri', serif;
  font-size: clamp(30px, 7vw, 52px);
  color: var(--gold);
  text-shadow: 0 0 40px rgba(212,168,71,0.35);
  line-height: 1;
}
.page-title {
  font-size: clamp(14px, 3vw, 18px);
  color: var(--muted);
  margin-top: 6px;
  letter-spacing: 1px;
}
.bismillah {
  font-family: 'Amiri', serif;
  font-size: clamp(14px, 2.5vw, 19px);
  color: rgba(240,204,120,0.6);
  margin-top: 10px;
}

/* ── Stats bar ── */
.stats-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
  flex-wrap: wrap;
  padding: 14px 20px;
  background: var(--bg2);
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  color: var(--muted);
}
.stat { display: flex; align-items: center; gap: 6px; }
.stat strong { color: var(--gold); font-size: 16px; }
.progress-bar {
  width: 160px;
  height: 4px;
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--gold);
  border-radius: 2px;
  transition: width 0.4s ease;
}

/* ── Controls ── */
.controls {
  max-width: 1000px;
  margin: 0 auto;
  padding: 20px 16px 8px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.filter-row, .action-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.filter-label {
  font-size: 12px;
  color: var(--muted);
  margin-left: 4px;
}

.btn {
  padding: 7px 16px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  font-family: 'Cairo', sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn:hover { border-color: var(--gold); color: var(--gold-lt); }
.btn.active {
  background: rgba(212,168,71,0.15);
  border-color: var(--gold);
  color: var(--gold-lt);
  font-weight: 600;
}
.btn-action {
  padding: 7px 18px;
  border-radius: 20px;
  border: none;
  font-family: 'Cairo', sans-serif;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-shuffle { background: rgba(212,168,71,0.18); color: var(--gold-lt); }
.btn-shuffle:hover { background: rgba(212,168,71,0.3); }
.btn-show { background: rgba(76,175,130,0.15); color: var(--green); }
.btn-show:hover { background: rgba(76,175,130,0.28); }
.btn-hide { background: rgba(255,255,255,0.06); color: var(--muted); }
.btn-hide:hover { background: rgba(255,255,255,0.12); }

/* ── Card Grid ── */
.grid {
  max-width: 1000px;
  margin: 0 auto;
  padding: 20px 16px 60px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}

/* ── Flip Card ── */
.card-wrap {
  perspective: 900px;
  height: 180px;
  cursor: pointer;
}
.card-wrap.hidden { display: none; }
.card-inner {
  position: relative;
  width: 100%; height: 100%;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}
.card-wrap.flipped .card-inner { transform: rotateY(180deg); }

.card-front, .card-back {
  position: absolute; inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 14px;
  padding: 16px;
  display: flex;
  flex-direction: column;
}
/* Front */
.card-front {
  background: var(--bg2);
  border: 1px solid var(--line);
}
.card-front:hover {
  border-color: rgba(212,168,71,0.4);
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.card-num {
  font-size: 11px;
  color: var(--gold-dk);
  letter-spacing: 1px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.juz-badge {
  background: rgba(212,168,71,0.12);
  border: 1px solid rgba(212,168,71,0.25);
  border-radius: 10px;
  padding: 2px 8px;
  font-size: 10px;
  color: var(--gold);
}
.card-start {
  font-family: 'Amiri', serif;
  font-size: 16px;
  line-height: 1.9;
  color: var(--white);
  flex: 1;
}
.card-hint {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  margin-top: 8px;
}
/* Back */
.card-back {
  background: linear-gradient(135deg, #0F2035 0%, #1A3050 100%);
  border: 1px solid rgba(212,168,71,0.45);
  transform: rotateY(180deg);
  justify-content: center;
  align-items: center;
  text-align: center;
  box-shadow: inset 0 0 30px rgba(212,168,71,0.05);
}
.card-end {
  font-family: 'Amiri', serif;
  font-size: clamp(17px, 2.5vw, 22px);
  color: var(--gold-lt);
  line-height: 2;
  text-shadow: 0 0 20px rgba(212,168,71,0.3);
}
.card-back-num {
  font-size: 11px;
  color: var(--gold-dk);
  margin-bottom: 10px;
}
/* Similar badge */
.similar-tag {
  margin-top: 10px;
  font-size: 10px;
  color: var(--muted);
  background: rgba(255,255,255,0.05);
  border-radius: 8px;
  padding: 3px 10px;
}

/* ── Empty state ── */
.empty { text-align: center; padding: 60px 20px; color: var(--muted); grid-column: 1/-1; }

/* ── Scroll to top ── */
.scroll-top {
  position: fixed;
  bottom: 24px;
  left: 24px;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: rgba(212,168,71,0.2);
  border: 1px solid var(--line);
  color: var(--gold);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  opacity: 0.7;
}
.scroll-top:hover { opacity: 1; background: rgba(212,168,71,0.35); }

/* Responsive */
@media (max-width: 480px) {
  .grid { grid-template-columns: 1fr; }
  .card-wrap { height: 200px; }
}
</style>
</head>

const verses = [

  { n: 3,   juz: 4,
    start: "وَإِنْ خِفْتُمْ أَلَّا تُقْسِطُوا فِي الْيَتَامَىٰ فَانكِحُوا مَا طَابَ لَكُم...",

  { n: 4,   juz: 4,

  { n: 5,   juz: 4,
    start: "وَلَا تُؤْتُوا السُّفَهَاءَ أَمْوَالَكُمُ الَّتِي جَعَلَ اللَّهُ لَكُمْ قِيَامًا...",

  { n: 7,   juz: 4,

  { n: 10,  juz: 4,

  { n: 11,  juz: 4,
    start: "يُوصِيكُمُ اللَّهُ فِي أَوْلَادِكُمْ ۖ لِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ...",

// ─── State ────────────────────────────────────────────────────────────────
let currentJuz = 0;        // 0 = all
let order = verses.map((_, i) => i);
let flipped = new Set();

// ─── Render ───────────────────────────────────────────────────────────────
function juzLabel(j) {
  return j === 4 ? 'الجزء الرابع' : j === 5 ? 'الجزء الخامس' : 'الجزء السادس';
}

function similarNote(v) {
  const s = similar[v.n];
  if (!s) return '';
  return `تشابه مع آية: ${s.join('، ')}`;
}

function renderCards() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const filtered = order.filter(i => currentJuz === 0 || verses[i].juz === currentJuz);

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">لا توجد آيات في هذا الجزء</div>';
    updateStats(0, 0);
    return;
  }

  filtered.forEach(i => {
    const v = verses[i];
    const isFlipped = flipped.has(i);
    const note = similarNote(v);

    const wrap = document.createElement('div');
    wrap.className = 'card-wrap' + (isFlipped ? ' flipped' : '');
    wrap.dataset.idx = i;
    wrap.innerHTML = `
      <div class="card-inner">
        <div class="card-front">
          <div class="card-num">
            <span>آية ${v.n}</span>
            <span class="juz-badge">${juzLabel(v.juz)}</span>
          </div>
          <div class="card-start">${v.start}</div>
          <div class="card-hint">اضغط لإظهار الخاتمة</div>
        </div>
        <div class="card-back">
          <div class="card-back-num">آية ${v.n}</div>
          <div class="card-end">${v.end}</div>
          ${note ? `<div class="similar-tag">⚠️ ${note}</div>` : ''}
        </div>
      </div>`;

    wrap.addEventListener('click', () => toggle(wrap, i));
    grid.appendChild(wrap);
  });

  updateStats(filtered.length, filtered.filter(i => flipped.has(i)).length);
}

function toggle(wrap, idx) {
  if (flipped.has(idx)) {
    flipped.delete(idx);
    wrap.classList.remove('flipped');
  } else {
    flipped.add(idx);
    wrap.classList.add('flipped');
  }
  const vis = document.querySelectorAll('.card-wrap:not(.hidden)').length;
  const rev = document.querySelectorAll('.card-wrap.flipped').length;
  updateStats(vis, rev);
}

function updateStats(total, revealed) {
  document.getElementById('total-count').textContent = total;
  document.getElementById('revealed-count').textContent = revealed;
  const pct = total > 0 ? Math.round(revealed / total * 100) : 0;
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ─── Controls ─────────────────────────────────────────────────────────────
document.querySelectorAll('.btn[data-juz]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.btn[data-juz]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentJuz = parseInt(btn.dataset.juz);
    renderCards();
  });
});

document.getElementById('btn-shuffle').addEventListener('click', () => {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  flipped.clear();
  renderCards();
});

document.getElementById('btn-show').addEventListener('click', () => {
  document.querySelectorAll('.card-wrap:not(.hidden)').forEach(w => {
    const idx = parseInt(w.dataset.idx);
    flipped.add(idx);
    w.classList.add('flipped');
  });
  const vis = document.querySelectorAll('.card-wrap:not(.hidden)').length;
  updateStats(vis, vis);
});

document.getElementById('btn-hide').addEventListener('click', () => {
  flipped.clear();
  document.querySelectorAll('.card-wrap').forEach(w => w.classList.remove('flipped'));
  const vis = document.querySelectorAll('.card-wrap:not(.hidden)').length;
  updateStats(vis, 0);
});

// ─── Init ─────────────────────────────────────────────────────────────────
renderCards();
</script>
